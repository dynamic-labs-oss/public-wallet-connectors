name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to publish. The ref must be a chore(release) commit
        default: main

jobs:
  publish:
    environment: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: write
      actions: read
      deployments: write
      packages: write
    steps:
      - name: Authenticate with the JFrog registry
        shell: bash
        env:
          JFROG_TOKEN: ${{ secrets.JFROG_PUBLISHING_TOKEN }}
        run: |-
          set -eo pipefail
          if [ -z "$JFROG_TOKEN" ]; then
            echo "::warning::No JFrog token provided, packages will only be published to npmjs"
            exit 0
          fi
          npm config set "//fbinfra555artifactory.jfrog.io/artifactory/api/npm/dynamic-npm/:_authToken=${JFROG_TOKEN}"
          echo "JFROG_ENABLED=true" >> "$GITHUB_ENV"
      - name: Publish
        env:
          ACTIONS_RUNNER_DEBUG: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: dynamic-labs-oss/public-wallet-connectors/.github/actions/release@main
        with:
          type: publish
          ref: ${{ github.event.inputs.ref }}
